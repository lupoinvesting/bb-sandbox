[project]
name = "bb-sandbox"
version = "0.1.0"
description = "Interactive Blood Bowl formation and strategy sandbox"
readme = "README.md"
authors = [
    { name = "Lorenzo", email = "l.cimarossa@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pygame>=2.6.1",
]

[project.scripts]
bb-sandbox = "bb_sandbox:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
# Reason: SIM118 reads Board.keys() as dict.keys(), but it's a method that
# returns a tuple, so its "fix" would break the code.
ignore = ["SIM118"]

[tool.ruff.lint.flake8-bugbear]
# Reason: immutable NamedTuples are safe as default arguments.
extend-immutable-calls = ["bb_sandbox.pitch.Square", "bb_sandbox.render.PitchSprite"]

[tool.mypy]
plugins = ["pydantic.mypy"]
